name: Quant Analysis Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run_task:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tushare requests python-dotenv

      - name: Minimal environment test
        run: |
          python -c "
import os
print('✅ Python环境正常')
print('LLM_API_KEY present:', bool(os.environ.get('LLM_API_KEY')))
print('TUSHARE_TOKEN present:', bool(os.environ.get('TUSHARE_TOKEN')))
"
